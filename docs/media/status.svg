  <text x="136" y="1848" font-size="19.5" fill="#e6eef7">It boots to the main menu and plays the opening in the lit Shrine of</text>
  <text x="136" y="1874" font-size="19.5" fill="#e6eef7">Resurrection at 30 fps. Next: the Great Plateau and the open world.</text>

