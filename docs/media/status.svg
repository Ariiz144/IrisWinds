  <!-- what it means -->
  <g font-size="18.5" fill="#d3deea">
    <text x="624" y="490">The game's three modules (main, subsdk0</text><text x="624" y="514">and the Switch SDK) load, relocate and</text><text x="624" y="538">link the way they do on the console.</text>
    <text x="624" y="589">177,356 functions found across the</text><text x="624" y="613">three modules, jump tables included.</text>
    <text x="624" y="676">The whole game recompiles to native</text><text x="624" y="700">code: about 550 MB of C, a 210 MB library.</text>
    <text x="624" y="751">Threads, locks, condition variables,</text><text x="624" y="775">memory and 4-core scheduling run the</text><text x="624" y="799">game's own job system.</text>
    <text x="624" y="850">Files, controllers, applets, time and</text><text x="624" y="874">accounts: enough to boot into the game.</text>
    <text x="624" y="937">41,056 game files (15 GB), read from an</text><text x="624" y="961">image built from your own RomFS.</text>
    <text x="624" y="1012">Menus and the Shrine of Resurrection</text><text x="624" y="1036">render lit, with fog and effects, at the</text><text x="624" y="1060">game's 30 fps. The open world is next.</text>
    <text x="624" y="1111">Every shader of the opening and the shrine</text><text x="624" y="1135">translates to Vulkan.</text>
    <text x="624" y="1186">Any controller, by button position.</text><text x="624" y="1210">Keyboard and mouse: every key</text><text x="624" y="1234">remappable, a mouse camera.</text>
    <text x="624" y="1285">Music, sound effects and voices, mixed by</text><text x="624" y="1309">the game SDK's own audio renderer.</text>
    <text x="624" y="1360">Text and voices chosen separately: e.g.</text><text x="624" y="1384">Spanish text, Japanese voices. Menus in</text><text x="624" y="1408">all 11 of the game's languages.</text>
  </g>

