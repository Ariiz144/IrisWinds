    <text x="56" y="1514">PC graphics options</text>
    <text x="56" y="1576">4K and higher resolutions</text>
    <text x="56" y="1638">AMD FSR with frame generation</text>
    <text x="56" y="1700">NVIDIA DLSS with frame generation</text>
    <text x="566" y="1452">Mods</text>
    <text x="566" y="1514">Any controller, detected automatically</text>
    <text x="566" y="1576">Keyboard &amp; mouse, remappable keys</text>
    <text x="566" y="1638">Latest game version (1.8.2)</text>
    <text x="566" y="1700">DLC</text>
    <text x="56" y="1762">Text &amp; voice languages, separately</text>
    <text x="566" y="1762">Menus in the game's 11 languages</text>
  </g>
